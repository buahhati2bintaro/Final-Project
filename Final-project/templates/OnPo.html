{% extends "base.html" %}
{% block title %}The Online Posting App{% endblock %}
{% block content %}

<h3>The Online Posting App</h3>

{% if edit_index is defined %} 
<form method="post" action="/todo/edit/{{ edit_index }}"> 
    <input type="text" name="item" value="{{ edit_value }}" required>
    <button>Simpan</button>
    <a href="/todo">Batal</a>
</form>
{% else %} 
<form method="post" action="/OnPo">
    <input type="text" name="item" placeholder="Tulis kegiatan/to do.." required>
    <button>Tambah</button>
</form>
{% endif %}

<ul>
    {% for t in OnPos %}
    <li>
        <span>{{ t }}</span>
        <div>
            <button><a href="/OnPo/edit/{{ loop.index0 }}">Edit</a></button>
            <button><a href="/OnPo/hapus/{{ loop.index0 }}">Hapus</a></button>
        </div>
    </li>
    {% else %}
    <li>Belum ada Posting.</li>
    {% endfor %}
</ul>

{% endblock %}
