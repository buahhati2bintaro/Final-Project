{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}  

<h2>Ayo berkenal dengan sesama!</h2>
    <img src="{{ url_for('static', filename='images/Call.jpg') }}" alt="contact" width="100">
    <P>Yuk masukin nama kamu di dalam form!</P>
    <form action="#" method="post">
        <label>Nama:</label>
        <input type="text" name="nama"><br>
        <label>Email:</label>
        <input type="email" name="email"><br>
        <label>Pesan:</label>
        <textarea name="pesan" rows="4"></textarea><br> 

        <button type="submit">Kirim</button>
    </form>
{% endblock %}
